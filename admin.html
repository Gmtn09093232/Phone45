<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Bingo — Admin</title>
<style>
  :root { --bg:#161622; --panel:#242438; --accent:#FF9800; --green:#4CAF50; --red:#e53935; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color:#fff; margin:0; padding:20px; }
  h1 { text-align:center; margin-top:0; }
  .panel { background: var(--panel); padding:20px; border-radius:10px; max-width:820px; margin:0 auto 20px; }
  h2 { margin-top:0; font-size:18px; color: var(--accent); }
  input, button { padding:10px; border-radius:5px; border:none; font-size:15px; }
  input { background:#1b1b2b; color:#fff; width:100%; }
  button { background: var(--green); color:#fff; cursor:pointer; font-weight:bold; }
  button:disabled { background: gray; cursor:not-allowed; }
  button.danger { background: var(--red); }
  .row { display:flex; gap:10px; align-items:center; }
  .row > input { flex:1; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px; text-align:left; border-bottom:1px solid #343450; }
  th { color:#9aa; font-weight:600; }
  .empty { color:#888; font-style:italic; }
  .draw { display:flex; gap:12px; margin:15px 0; }
  .ball { width:60px; height:60px; border-radius:50%; background: var(--accent); color:#000; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; }
  .btn-sm { padding:6px 12px; font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>

<h1>Dot Bingo — Admin</h1>

<div class="panel" id="authPanel">
  <h2>Admin Key</h2>
  <div class="row">
    <input type="password" id="adminKey" placeholder="Enter ADMIN_KEY from .env">
    <button onclick="saveKey()">Unlock</button>
  </div>
</div>

<div id="adminPanel" class="hidden">
  <div class="panel">
    <h2>Pending Transactions</h2>
    <table>
      <thead><tr><th>Player</th><th>Phone</th><th>Type</th><th>Amount</th><th>Action</th></tr></thead>
      <tbody id="txBody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Active Round Players</h2>
    <table>
      <thead><tr><th>Card</th><th>Name</th><th>Phone</th></tr></thead>
      <tbody id="playerBody"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>

    <div class="row" style="margin-top:20px;">
      <button onclick="draw()">Draw Winners</button>
      <button onclick="newRound()">Start New Round</button>
    </div>

    <div id="drawResult" class="hidden">
      <div class="draw"><div class="ball" id="b1">–</div><div class="ball" id="b2">–</div><div class="ball" id="b3">–</div></div>
      <ul id="winnerList" style="padding-left:18px;"></ul>
    </div>
  </div>
</div>

<script>
  // ⚠️ CHANGE THIS TO YOUR DEPLOYED BACKEND URL
  const LIVE_BACKEND_URL = 'https://YOUR-BACKEND-URL-HERE.com';

  const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
    ? 'http://localhost:3000' 
    : LIVE_BACKEND_URL;

  let adminKey = localStorage.getItem('dotBingoAdminKey') || '';
  let timer = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  async function api(path, options = {}) {
    const res = await fetch(API + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey, ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  function saveKey() {
    adminKey = $('adminKey').value.trim();
    if (!adminKey) return alert('Enter the admin key.');
    localStorage.setItem('dotBingoAdminKey', adminKey);
    unlock();
  }

  function unlock() {
    $('authPanel').classList.add('hidden');
    $('adminPanel').classList.remove('hidden');
    refreshAll();
    clearInterval(timer);
    timer = setInterval(refreshAll, 5000);
  }

  async function refreshAll() {
    await Promise.all([loadTransactions(), loadPlayers()]);
  }

  async function loadTransactions() {
    try {
      const rows = await api('/api/admin/transactions');
      const body = $('txBody');
      if (!rows.length) return body.innerHTML = '<tr><td colspan="5" class="empty">No pending transactions.</td></tr>';
      body.innerHTML = rows.map(t => `<tr><td>${esc(t.users?.name)}</td><td>${esc(t.users?.phone)}</td><td>${esc(t.type)}</td><td>${Number(t.amount).toFixed(2)}</td><td><button class="btn-sm" onclick="resolve(${t.id},'approve')">Approve</button> <button class="btn-sm danger" onclick="resolve(${t.id},'reject')">Reject</button></td></tr>`).join('');
    } catch (e) {
      $('txBody').innerHTML = `<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function resolve(id, action) {
    if (!confirm(`${action} transaction #${id}?`)) return;
    try {
      const data = await api(`/api/admin/transaction/${id}`, { method: 'POST', body: JSON.stringify({ action }) });
      alert(data.message);
      await refreshAll();
    } catch (e) { alert(e.message); }
  }

  async function loadPlayers() {
    try {
      const { round, players } = await api('/api/admin/players');
      const body = $('playerBody');
      if (!round) return body.innerHTML = '<tr><td colspan="3" class="empty">No active round.</td></tr>';
      if (!players.length) return body.innerHTML = '<tr><td colspan="3" class="empty">No players in this round yet.</td></tr>';
      body.innerHTML = players.map(p => `<tr><td>${esc(p.card_number)}</td><td>${esc(p.users?.name)}</td><td>${esc(p.users?.phone)}</td></tr>`).join('');
    } catch (e) {
      $('playerBody').innerHTML = `<tr><td colspan="3" class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function draw() {
    if (!confirm('Close the current round and draw 3 winners?')) return;
    try {
      const data = await api('/api/admin/draw', { method: 'POST' });
      $('drawResult').classList.remove('hidden');
      $('b1').textContent = data.draw_1;
      $('b2').textContent = data.draw_2;
      $('b3').textContent = data.draw_3;
      $('winnerList').innerHTML = data.winners.length
        ? data.winners.map(w => `<li>Card ${esc(w.card_number)} — ${esc(w.name)} (${esc(w.phone)})</li>`).join('')
        : '<li>No winners this round.</li>';
      await refreshAll();
    } catch (e) { alert(e.message); }
  }

  async function newRound() {
    if (!confirm('Start a new round?')) return;
    try {
      const data = await api('/api/admin/new-round', { method: 'POST' });
      alert(data.message);
      $('drawResult').classList.add('hidden');
      await refreshAll();
    } catch (e) { alert(e.message); }
  }

  if (adminKey) unlock();
</script>
</body>
</html>
