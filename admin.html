<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Bingo — Admin</title>
<style>
  :root { --bg:#161622; --panel:#242438; --accent:#FF9800; --green:#4CAF50; --red:#e53935; --blue:#2196F3; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color:#fff; padding:15px; }
  h1 { text-align:center; font-size: 22px; margin-bottom: 20px; }
  .panel { background: var(--panel); padding:15px; border-radius:10px; margin:0 auto 15px; max-width: 900px; }
  h2 { margin-bottom: 15px; font-size:18px; color: var(--accent); }
  
  /* Fix Inputs on iOS */
  input, button { padding: 12px; border-radius:6px; border:none; font-size:16px; }
  input { background:#1b1b2b; color:#fff; width:100%; margin-bottom: 10px; border: 1px solid #3b3b58; }
  button { background: var(--green); color:#fff; cursor:pointer; font-weight:bold; transition: 0.2s; }
  button:active { transform: scale(0.98); opacity: 0.9; }
  button:disabled { background: gray; cursor:not-allowed; transform:none; }
  button.danger { background: var(--red); }
  button.blue { background: var(--blue); }
  button.accent { background: var(--accent); color: #000; }

  /* Stack rows on mobile */
  .row { display:flex; flex-direction: column; gap:10px; margin-top: 15px; }
  .row-btn { display: flex; gap: 10px; flex-direction: column; margin-top: 15px; }
  
  /* Mobile-friendly scrollable tables */
  .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width: 500px; /* Forces scroll on small screens instead of squishing */ }
  th, td { padding:12px 8px; text-align:left; border-bottom:1px solid #343450; }
  th { color:#9aa; font-weight:600; white-space: nowrap; }
  .empty { color:#888; font-style:italic; text-align: center; }
  
  .btn-sm { padding:8px 12px; font-size:13px; width: 100%; margin-bottom: 5px; }
  .hidden { display:none; }
  .badge { background:#3b3b58; padding:2px 6px; border-radius:4px; font-size:12px; text-transform:uppercase; }
  .proof-text { font-family: monospace; background: #1b1b2b; padding: 6px; border-radius: 4px; font-size: 12px; border: 1px solid #3b3b58; display: inline-block; margin-top: 4px; word-break: break-all;}
  
  .place-1 { color: #FFD700; font-weight: bold; white-space: nowrap; }
  .place-2 { color: #C0C0C0; font-weight: bold; white-space: nowrap; }
  .place-3 { color: #CD7F32; font-weight: bold; white-space: nowrap; }
  
  .user-info-cell { font-size: 13px; }
  .user-info-cell small { color: #aaa; display: block; margin-top: 4px; }

  /* Desktop Adjustments */
  @media (min-width: 600px) {
    .row { flex-direction: row; align-items: center; }
    .row > input { flex: 1; margin-bottom: 0; }
    .row-btn { flex-direction: row; }
    .btn-sm { width: auto; margin-bottom: 0; margin-right: 5px; }
    table { min-width: 100%; }
  }
</style>
</head>
<body>

<h1>Dot Bingo — Admin</h1>

<div class="panel" id="authPanel">
  <h2>Admin Key</h2>
  <div class="row">
    <input type="password" id="adminKey" placeholder="Enter ADMIN_KEY from .env">
    <button onclick="saveKey()">Unlock</button>
  </div>
</div>

<div id="adminPanel" class="hidden">
  
  <!-- PENDING TRANSACTIONS -->
  <div class="panel">
    <h2>Pending Transactions</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Player</th><th>Type / Amount</th><th>Details & Proof</th><th>Action</th></tr>
        </thead>
        <tbody id="txBody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- ACTIVE ROUND & CONTROLS -->
  <div class="panel">
    <h2>Active Round Players</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Card</th><th>Name</th><th>Phone</th></tr></thead>
        <tbody id="playerBody"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="row-btn">
      <button onclick="draw()" class="accent">Draw Winners</button>
      <button onclick="newRound()" class="blue">Start New Round</button>
    </div>
  </div>

  <!-- PAST WINNERS LIST -->
  <div class="panel">
    <h2>Past Winners & History</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Round</th><th>Place</th><th>Winner</th><th>Phone</th><th>Prize Amount</th></tr>
        </thead>
        <tbody id="winnersBody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const LIVE_BACKEND_URL = 'https://phone45.vercel.app/'; // ⚠️ UPDATE THIS
  const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:3000' : LIVE_BACKEND_URL;

  let adminKey = localStorage.getItem('dotBingoAdminKey') || '';
  let timer = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  async function api(path, options = {}) {
    const res = await fetch(API + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey, ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  function saveKey() {
    adminKey = $('adminKey').value.trim();
    if (!adminKey) return alert('Enter the admin key.');
    localStorage.setItem('dotBingoAdminKey', adminKey);
    unlock();
  }

  function unlock() {
    $('authPanel').classList.add('hidden');
    $('adminPanel').classList.remove('hidden');
    refreshAll();
    clearInterval(timer);
    timer = setInterval(refreshAll, 5000);
  }

  async function refreshAll() {
    await Promise.all([loadTransactions(), loadPlayers(), loadWinners()]);
  }

  async function loadTransactions() {
    try {
      const rows = await api('/api/admin/transactions');
      const body = $('txBody');
      if (!rows.length) return body.innerHTML = '<tr><td colspan="4" class="empty">No pending transactions.</td></tr>';
      
      body.innerHTML = rows.map(t => {
        let details = '';
        if (t.type === 'deposit') {
          details = `<b>Method:</b> ${esc(t.method)}<br><span class="proof-text">${esc(t.proof)}</span>`;
        } else {
          details = `<b>Method:</b> ${esc(t.method)}<br><span class="proof-text">${esc(t.account_details)}</span>`;
        }

        return `<tr>
          <td class="user-info-cell">
            <b>${esc(t.users?.name)}</b>
            <small>${esc(t.users?.phone)}</small>
          </td>
          <td><b style="color:var(--accent)">${esc(t.type).toUpperCase()}</b><br>${Number(t.amount).toFixed(2)} Birr</td>
          <td>${details}</td>
          <td>
            <button class="btn-sm" onclick="resolve(${t.id},'approve')">Approve</button>
            <button class="btn-sm danger" onclick="resolve(${t.id},'reject')">Reject</button>
          </td>
        </tr>`;
      }).join('');
    } catch (e) {
      $('txBody').innerHTML = `<tr><td colspan="4" class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function resolve(id, action) {
    if (!confirm(`${action} transaction #${id}?`)) return;
    try {
      const data = await api(`/api/admin/transaction/${id}`, { method: 'POST', body: JSON.stringify({ action }) });
      alert(data.message);
      await refreshAll();
    } catch (e) { alert(e.message); }
  }

  async function loadPlayers() {
    try {
      const { round, players } = await api('/api/admin/players');
      const body = $('playerBody');
      if (!round) return body.innerHTML = '<tr><td colspan="3" class="empty">No active round.</td></tr>';
      if (!players.length) return body.innerHTML = '<tr><td colspan="3" class="empty">No players in this round yet.</td></tr>';
      body.innerHTML = players.map(p => `<tr><td><b>${esc(p.card_number)}</b></td><td>${esc(p.users?.name)}</td><td>${esc(p.users?.phone)}</td></tr>`).join('');
    } catch (e) {
      $('playerBody').innerHTML = `<tr><td colspan="3" class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function loadWinners() {
    try {
      const rounds = await api('/api/admin/winners');
      const body = $('winnersBody');
      
      if (!rounds || !rounds.length) {
        return body.innerHTML = '<tr><td colspan="5" class="empty">No rounds finished yet.</td></tr>';
      }

      let html = '';
      
      rounds.forEach(round => {
        const getWinner = (num) => {
          if (!round.winners) return null;
          const w = round.winners.find(x => x.card_number === num);
          if (!w) return null;
          return { name: w.users?.name || 'Unknown', phone: w.users?.phone || '' };
        };

        const w1 = getWinner(round.draw_1);
        const w2 = getWinner(round.draw_2);
        const w3 = getWinner(round.draw_3);

        html += `<tr>
          <td rowspan="3" style="vertical-align:top; font-weight:bold; border-bottom: 2px solid #555;">
            #${round.round_id}<br>
            <small style="color:#aaa; font-weight:normal; font-size:11px;">${round.total_players} players</small>
          </td>
          <td class="place-1">🥇 1st (${round.draw_1 || '-'})</td>
          <td>${w1 ? esc(w1.name) : '<span class="empty">No Winner</span>'}</td>
          <td>${w1 ? esc(w1.phone) : '-'}</td>
          <td style="color: var(--green); font-weight: bold;">${w1 ? round.prizes.p1.toFixed(2) + ' Birr' : '-'}</td>
        </tr>`;

        html += `<tr>
          <td class="place-2">🥈 2nd (${round.draw_2 || '-'})</td>
          <td>${w2 ? esc(w2.name) : '<span class="empty">No Winner</span>'}</td>
          <td>${w2 ? esc(w2.phone) : '-'}</td>
          <td style="color: var(--green); font-weight: bold;">${w2 ? round.prizes.p2.toFixed(2) + ' Birr' : '-'}</td>
        </tr>`;

        html += `<tr>
          <td class="place-3" style="border-bottom: 2px solid #555;">🥉 3rd (${round.draw_3 || '-'})</td>
          <td style="border-bottom: 2px solid #555;">${w3 ? esc(w3.name) : '<span class="empty">No Winner</span>'}</td>
          <td style="border-bottom: 2px solid #555;">${w3 ? esc(w3.phone) : '-'}</td>
          <td style="border-bottom: 2px solid #555; color: var(--green); font-weight: bold;">${w3 ? round.prizes.p3.toFixed(2) + ' Birr' : '-'}</td>
        </tr>`;
      });
      
      body.innerHTML = html;
    } catch (e) {
      $('winnersBody').innerHTML = `<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function draw() {
    if (!confirm('Close the current round and draw 3 winners?')) return;
    try {
      const data = await api('/api/admin/draw', { method: 'POST' });
      alert(`Round Finished!\n\nDraws: ${data.draw_1 || 'None'}, ${data.draw_2 || 'None'}, ${data.draw_3 || 'None'}\n\nTotal Pool: ${data.total_pool} Birr\n\n1st Prize: ${data.prize_1} Birr\n2nd Prize: ${data.prize_2} Birr\n3rd Prize: ${data.prize_3} Birr`);
      await refreshAll();
    } catch (e) { alert(e.message); }
  }

  async function newRound() {
    if (!confirm('Start a new round?')) return;
    try {
      const data = await api('/api/admin/new-round', { method: 'POST' });
      alert(data.message);
      await refreshAll();
    } catch (e) { alert(e.message); }
  }

  if (adminKey) unlock();
</script>
</body>
</html>
